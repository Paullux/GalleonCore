name: CI

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["site/**"]
  # Required checks must run even on site-only PRs; otherwise main is unmergeable.
  pull_request:

concurrency:
  group: galleon-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    # Normally 8 to 15 minutes. The runner has several times been cut or left stuck in the middle of the build (always at about 80 %, when the last
    # files of Bosun and many tests are compiled together); a limit makes a stuck job fail sooner, and a re-run of the failed job is then enough.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            cxx: g++
            flags: ""
          - name: Clang + ASan/UBSan
            cxx: clang++
            flags: "-DGALLEON_SANITIZE=ON -DGALLEON_FUZZ=ON"
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          bash tools/ci/install-ubuntu-deps.sh cmake g++ clang libclang-rt-18-dev \
            qt6-base-dev qt6-declarative-dev qt6-websockets-dev libhidapi-dev pkg-config \
            libwayland-dev libwayland-bin wayland-protocols \
            qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml qml6-module-qtqml-workerscript
      - name: Configure
        run: cmake -B build -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DGALLEON_WERROR=ON ${{ matrix.flags }}
      - name: Build
        # A number of jobs, not a bare -j (as many compilations as there are files ready): perhaps the cause of the cuts above, not proven. The lint job
        # builds this way and has not been cut since.
        run: cmake --build build -j"$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Fuzz (60 s)
        if: contains(matrix.flags, 'GALLEON_FUZZ')
        run: ./build/fuzz/fuzz_input_report -max_total_time=60
      - name: Fuzz the keyboard live-lighting allowlist (60 s)
        if: contains(matrix.flags, 'GALLEON_FUZZ')
        run: ./build/fuzz/fuzz_live_guard -max_total_time=60
      - name: Fuzz the keyboard live-lighting link (60 s)
        if: contains(matrix.flags, 'GALLEON_FUZZ')
        run: ./build/fuzz/fuzz_live_link -max_total_time=60

  # clang-tidy was a single step of about 23 minutes in a lint job of 26: it now runs as several jobs at once, each on its own machine, over its share of the files
  # (tools/ci/clang_tidy_shard.py: the same set of files as before, dealt out in turn, tested to cover it exactly). Each one still configures and builds
  # first (about 3 minutes: the moc and other generated files are needed). The `lint` job below waits for all of them.
  clang-tidy:
    name: clang-tidy (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    # A part is normally about 10 minutes. The build step has twice stayed "in progress" for 47 minutes before the job was cut (a runner that
    # stopped answering); a limit makes it fail sooner, and a re-run of the failed job is then enough.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          bash tools/ci/install-ubuntu-deps.sh cmake g++ clang-tidy \
            qt6-base-dev qt6-declarative-dev qt6-websockets-dev libhidapi-dev pkg-config \
            libwayland-dev libwayland-bin wayland-protocols \
            qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml qml6-module-qtqml-workerscript
      - name: Configure
        run: cmake -B build
      - name: Build (generates moc files)
        # A number of jobs, not a bare -j (as many compilations as there are files ready): perhaps the cause of the hangs above, not proven.
        run: cmake --build build -j"$(nproc)"
      - name: clang-tidy
        run: python3 tools/ci/clang_tidy_shard.py "${{ matrix.shard }}" "${{ strategy.job-total }}"

  # The name `lint` is kept: it is what stands for the whole check. It waits for every clang-tidy part and fails if one did not pass (a job skipped
  # because a part failed would otherwise count as passed), then runs the quick steps that need no build.
  lint:
    runs-on: ubuntu-24.04
    needs: clang-tidy
    if: ${{ always() }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Every clang-tidy part must have passed
        if: needs.clang-tidy.result != 'success'
        run: |
          echo "clang-tidy: ${{ needs.clang-tidy.result }}"
          exit 1
      - name: Install dependencies
        run: |
          bash tools/ci/install-ubuntu-deps.sh cmake g++ clang-tidy \
            qt6-base-dev qt6-declarative-dev qt6-websockets-dev libhidapi-dev pkg-config pipx \
            libwayland-dev libwayland-bin wayland-protocols \
            qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml qml6-module-qtqml-workerscript
      - name: qmllint
        run: /usr/lib/qt6/bin/qmllint widgets/*.qml bosun/qml/*.qml daemon/qml/*.qml
      - name: Decisions of tools/check.py
        run: python3 -B -m unittest discover -s tools -p 'test_*.py' # -B: no __pycache__ for reuse to complain about
      - name: REUSE licensing
        run: pipx run reuse lint
