name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml", "tools/website/download_stats.py", "tools/test_download_stats*", "tools/website/release_ready.py", "tools/test_release_ready.py", "CMakeLists.txt"]
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_first.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check counter changes
        if: github.event_name == 'push'
        run: |
          python3 -m unittest discover -s tools -p 'test_download_stats.py'
          node tools/test_download_stats_js.js
      - name: Wait for the linked release downloads
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(sed -n 's/project(GalleonCore VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)
          if gh release view "v$version" --json assets,isDraft,isPrerelease > "$RUNNER_TEMP/site-release.json"; then
            ready=$(python3 tools/website/release_ready.py "$version" "$RUNNER_TEMP/site-release.json" site/index.html)
          else
            ready=false
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" != true ]; then echo "Keeping the current website until all release downloads exist."; fi
      - name: Collect daily download measurements
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/website/download_stats.py \
            --previous-url https://galleoncore.xyz/downloads-weekly.json \
            --previous-url https://galleoncore.pages.dev/downloads-weekly.json \
            --previous-url https://paullux.github.io/GalleonCore/downloads-weekly.json \
            --output site/downloads-weekly.json
      - name: Deploy to Cloudflare Pages
        if: ${{ steps.release.outputs.ready == 'true' && env.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: e272635a5bb7cf86402f363a755ce70b
          command: pages deploy site --project-name=galleoncore
      - uses: actions/configure-pages@v5
        if: steps.release.outputs.ready == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.release.outputs.ready == 'true'
        with:
          path: site
      # actions/deploy-pages sometimes finds no artifact right after its upload ("Found 0 artifact(s)": runs 79, 82, 83 and 84 of this workflow), and the cause is not known:
      # in run 84 the API listed the artifact 0.3 s before deploy-pages found none. A re-run of the failed job cannot fix it (it uploads a second artifact of the same name:
      # "Found 2 artifact(s)", run 84 attempt 2). So the deployment is tried again in the same run, which adds no second artifact.
      # The two steps that list the artifacts only print: what exists, and when, at the moment of each try; they never fail the job.
      - name: Let the artifact settle, and list the artifacts of this run
        if: steps.release.outputs.ready == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 10
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | "artifact \(.id) \(.name) created \(.created_at) expired \(.expired)"'
      - id: deployment_first
        uses: actions/deploy-pages@v4
        if: steps.release.outputs.ready == 'true'
        continue-on-error: true
      - name: After a failed first try, wait and list the artifacts again
        if: steps.release.outputs.ready == 'true' && steps.deployment_first.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "The first try of deploy-pages failed; trying again in 20 s."
          sleep 20
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | "artifact \(.id) \(.name) created \(.created_at) expired \(.expired)"'
      - id: deployment
        uses: actions/deploy-pages@v4
        if: steps.release.outputs.ready == 'true' && steps.deployment_first.outcome == 'failure'
